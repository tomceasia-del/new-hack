<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>รีเซ็ต Cookie — Project CS</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --bg: #0b0d10;
      --card: #141821;
      --text: #f0f2f7;
      --muted: rgba(240, 242, 247, 0.66);
      --accent: #7dd3a8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, "Noto Sans Thai", sans-serif; }
    .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 32px 28px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); }
    h1 { font-size: 1.2rem; margin: 0 0 12px; }
    p { color: var(--muted); font-size: 0.95rem; line-height: 1.55; margin: 0 0 16px; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    a.btn, button.btn {
      display: inline-flex; justify-content: center; align-items: center;
      padding: 12px 16px; border-radius: 12px; font-weight: 700; font-size: 0.95rem;
      text-decoration: none; cursor: pointer; border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(125, 211, 168, 0.16), rgba(125, 211, 168, 0.08));
      color: var(--text);
    }
    a.btn:hover, button.btn:hover { background: linear-gradient(135deg, rgba(125, 211, 168, 0.24), rgba(125, 211, 168, 0.12)); }
    a.btn.secondary, button.btn.secondary {
      background: transparent;
      color: var(--muted);
    }
    code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 6px; font-size: 0.86em; }
    .ok { color: var(--accent); font-weight: 700; }
    .status { font-size: 0.85rem; color: var(--muted); margin-top: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>รีเซ็ต Cookie สำเร็จ</h1>
      <p>
        ระบบล้าง cookie ของ Project CS ทั้งหมดให้แล้ว — กรณีเจอ
        <code>494 REQUEST_HEADER_TOO_LARGE</code> ปัญหานี้จะหายไป
        ลองกลับเข้าใช้งานได้ทันที
      </p>
      <p class="status" id="extra-status"></p>
      <div class="actions">
        <a class="btn" href="/cs">เข้าหน้า Mock (/cs)</a>
        <a class="btn secondary" href="/login.html">ไปหน้า Login</a>
        <button class="btn secondary" id="btn-deep-clear" type="button">ล้าง cookie ฝั่ง browser ซ้ำอีกครั้ง</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var st = document.getElementById("extra-status");
      var btn = document.getElementById("btn-deep-clear");
      function deepClear() {
        try {
          var hosts = [location.hostname, "." + location.hostname];
          var parts = location.hostname.split(".");
          if (parts.length > 1) {
            hosts.push(parts.slice(-2).join("."));
            hosts.push("." + parts.slice(-2).join("."));
          }
          var paths = ["/", "/api", "/api/auth"];
          var names = (document.cookie || "").split(";").map(function (s) {
            return s.split("=")[0].trim();
          }).filter(Boolean);
          names.forEach(function (n) {
            paths.forEach(function (p) {
              document.cookie = n + "=; Max-Age=0; Path=" + p;
              hosts.forEach(function (h) {
                document.cookie = n + "=; Max-Age=0; Path=" + p + "; Domain=" + h;
              });
            });
          });
          if (st) st.textContent = "ล้าง cookie ฝั่ง browser แล้ว (" + names.length + " รายการ)";
        } catch (e) {
          if (st) st.textContent = "ล้างฝั่ง browser ผิดพลาด: " + e.message;
        }
      }
      deepClear();
      if (btn) btn.addEventListener("click", function () { deepClear(); });
    })();
  </script>
</body>
</html>
