ข้อ 1: อยากได้คลิปแบบไหน?

🛒 ขายสินค้า (ปักตะกร้า) → ถ้าเลือกข้อนี้ รบกวนแจ้งชื่อสินค้าด้วยครับ

🔥 ไวรัลล้วนๆ (ไม่ขายของ)

📸 มีรูปสินค้าหรือรูปตัวละครที่จะใช้มั้ย?

📎 มีรูป แนบให้ดูเลยตอนนี้ → ระบบจะสแกนรูปเพื่อเขียน Prompt ให้ตรง 100% (โปรดระวังห้ามแนบรูป Before/After)

❌ ไม่มีรูป → ให้จาร์วิสออกแบบให้เลย

ข้อ 2: อยากได้ทั้งหมดกี่ฉาก? (1-50 ฉาก)

(แต่ละฉากยาว 8 วินาที)

🎯 5 ฉาก = 40 วินาที

🎯 10 ฉาก = 1 นาที 20 วินาที

🎯 20 ฉาก = 2 นาที 40 วินาที

🎯 30 ฉาก = 4 นาที

🎯 50 ฉาก = 6 นาที 40 วินาที
(หมายเหตุ: ผมจะส่งให้ทีละ 10 ฉากต่อชุดครับ)

ข้อ 3: 🎬 เลือกแนวคลิปที่ต้องการ

🔥 แนวไวรัลระดับโลก 2026:
🎬 สารคดีสั้นเข้มข้น / 📖 เล่าเรื่องแบบหนังสั้นมี Plot Twist / 😤 ระบายแบบดิบๆ ประชดสังคม / 🎭 ดึงคนดูเข้ามาเป็นส่วนหนึ่ง / 💀 ฮาแบบดาร์กไร้สาระแต่จับใจ / 🔥 จุดชนวนถกเถียงในคอมเมนต์ / 🤯 หักล้างความเชื่อผิดๆ / 📺 เหมือนรายการเรียลลิตี้ / 🧠 สอนความรู้เข้มข้น / ⚡ เรื่องสั้นจบใน 1 ฉากกระแทกอารมณ์

🇹🇭 แนวฮิตในไทย:
👻 เล่าเรื่องผี สยองขวัญ ตำนานหลอน / 🙏 เล่าเรื่องธรรมะ คติสอนใจ กฎแห่งกรรม ปล่อยวาง / 😂 กวนตีนฮาแซ่บ / 😤 ประชดสังคม / 🥊 ปะทะคารมเดือด / 💔 เศร้าแต่มีสาระ / 🤑 เงินทองกวนๆ

💊 แนวสุขภาพ/ความรู้:
💊 สุขภาพตรงๆ / 🧬 วิทยาศาสตร์บ้านๆ / 🤯 ทฤษฎีสมคบคิด

🎨 หรืออื่นๆ แจ้งมาได้เลยครับ

ข้อ 4: 🧑‍🤝‍🧑 เลือกตัวละครที่ต้องการ

👤 คนจริงๆ เหมือนจริง (Hyper-Realistic AI Human):
👨 ชายหนุ่มไทย วัยรุ่น/วัยทำงาน / 👩 สาวไทย สวยน่ารัก/เท่ๆ คูลๆ / 👴 คนแก่ไทย ลุงป้าขี้บ่นขี้สงสัย / 👶 เด็กน้อยน่ารักฉลาดเกินวัย / 👨‍⚕️ หมอ/ผู้เชี่ยวชาญ ให้ความน่าเชื่อถือ / 👨‍🍳 เชฟ/พ่อค้าแม่ค้า คนธรรมดาเข้าถึงได้ / 🧕 คนหลากเชื้อชาติ ฝรั่ง ญี่ปุ่น เกาหลี ฯลฯ / 👥 กลุ่มเพื่อน 2 คน (แนะนำ 2 คนเท่านั้นเพื่อแยกเสียง) / 🎨 กำหนดเอง

🎨 Pixar 3D การ์ตูน:
🧠 เซลล์สมอง/นิวรอน / 💪 กล้ามเนื้อ / 🫀 หัวใจ / 🦴 กระดูก / 🦠 แบคทีเรีย / 🧬 DNA / 🩸 เม็ดเลือด / 👹 ปีศาจไขมัน / 🌿 ผักผลไม้ / 💊 ยาเม็ด / 🤖 หุ่นยนต์ AI / 🐧 สัตว์พูดได้ เพนกวิน แมว หมา / 💀 โครงกระดูกตลก / 👻 ผี/วิญญาณ น่ารักหรือน่ากลัว / 🧸 ของเล่นมีชีวิต / 🎨 หรืออื่นๆ

ข้อ 5: 🏔️ เลือกแนวฉากภาพที่ต้องการ

ฉากในร่างกาย:
🫁 ภายในปอด / 🧠 ภายในสมอง / 🫀 ห้องหัวใจ / 🦴 โครงกระดูก / 🩸 กระแสเลือด / 🦷 ช่องปาก / 🔬 ระดับเซลล์ซูมเข้าไป

ฉากแฟนตาซี:
🏰 ปราสาทลอยฟ้า / 🌋 ภูเขาไฟลาวา / 🌊 ใต้ทะเลลึก / 🌌 อวกาศ-ดาวต่างดาว / 🌲 ป่าเวทมนตร์ / ❄️ ดินแดนน้ำแข็ง / ☁️ เมืองบนก้อนเมฆ

ฉากเมือง/ชีวิตจริง:
🏙️ ตึกสูงกลางเมือง / 🏚️ ซอยมืดน่ากลัว / 🏫 ห้องเรียน / 🏪 ร้านสะดวกซื้อ / 🍜 ร้านก๋วยเตี๋ยวข้างทาง / 🏥 โรงพยาบาล / 🚇 รถไฟฟ้า / 🏠 ห้องนอนตอนดึก

🎨 หรืออื่นๆ แจ้งมาได้เลยครับ

ข้อ 6: อยากได้ภาษาแบบไหน?

💢 กู/มึง (เข้มข้นสุดๆ)

😊 พี่/น้อง (เป็นกันเอง)

🤝 เราๆ (กลางๆ ไม่แรงเกิน)

ข้อ 7: 🎤 เลือกโทนเสียงที่ต้องการ

👦 เสียงเด็ก:
👦 เด็กชาย — เสียงใส ร่าเริง พลังเยอะ / 👧 เด็กหญิง — เสียงแหลมน่ารัก สดใส

👨 เสียงผู้ชาย:
🧑 หนุ่มวัยรุ่น — เสียงสูงคม พูดเร็ว กวนตีน / 👨 ชายวัยทำงาน — เสียงกลางๆ มั่นใจ จริงจัง / 👨‍⚕️ ชายน่าเชื่อถือ — เสียงทุ้มหนักแน่น สุขุม เหมือนหมอ / 👴 ลุงคนแก่ — เสียงแหบพร่า ช้าๆ สุขุม

👩 เสียงผู้หญิง:
👩 สาววัยรุ่น — เสียงใสสูง พูดเร็ว ตื่นเต้น / 👩‍💼 หญิงวัยทำงาน — เสียงนุ่ม มั่นใจ เป็นมืออาชีพ / 👵 ป้า/ยาย — เสียงแหบอบอุ่น ช้าๆ ใจดี/ขี้บ่น

⚡ เสียงพิเศษ:
🤖 เสียงหุ่นยนต์ / 😤 เสียงตลกจี๊ดจ๊าด / 🗣️ เสียงนักข่าว

ข้อ 8: 🎯 เป้าหมายหลักของคลิปนี้คืออะไร?

👀 ดันยอดวิว (Reach)

💬 ดันคอมเมนต์ (Engagement)

🔄 ดันยอดแชร์ (Virality)

🛒 ดันยอดขาย (Conversion)

➕ ดันยอดผู้ติดตาม (Follow)

ข้อ 9: 👥 กลุ่มเป้าหมายหลักคือใคร?

👩 ผู้หญิง 18-25 / 👨 ผู้ชาย 18-25

👩‍💼 ผู้หญิงวัยทำงาน 25-35 / 👨‍💼 ผู้ชายวัยทำงาน 25-35

👵 วัย 35+ / 🎓 นักเรียน/นักศึกษา

🎨 กำหนดเอง (แจ้งมา)

ข้อ 10: 🔥 ระดับความแรงของคอนเทนต์?

(หากเลือกปักตะกร้า ระบบจะล็อคที่ "เซฟโซน" อัตโนมัติ)

🟢 เซฟโซน (ปลอดภัยสุด)

🟡 ขอบเขต (เดินขอบนิดหน่อย)

🔴 สุดขอบ (แรงสุดเท่าที่กฎยอมรับ)